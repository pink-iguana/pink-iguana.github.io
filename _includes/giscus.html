{% if site.giscus.repo %}
<div class="post-comments">
  <h2>Comments</h2>
  <script src="https://giscus.app/client.js"
          data-repo="{{ site.giscus.repo }}"
          data-repo-id="{{ site.giscus.repo_id }}"
          data-category="{{ site.giscus.category | default: 'General' }}"
          data-category-id="{{ site.giscus.category_id }}"
          data-mapping="{{ site.giscus.mapping | default: 'pathname' }}"
          data-strict="1"
          data-reactions-enabled="1"
          data-emit-metadata="0"
          data-input-position="{{ site.giscus.input_position | default: 'top' }}"
          data-theme="{{ site.giscus.theme | default: 'light' }}"
          data-lang="{{ site.giscus.lang | default: 'en' }}"
          crossorigin="anonymous"
          async>
  </script>
</div>
{% endif %}
